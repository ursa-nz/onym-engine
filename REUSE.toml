version = 1

# The conformance fixtures and corpus are derived from the WordNet 3.0 lexical database from
# Princeton University, redistributed under the permissive WordNet licence. Declared here because
# the fixtures are machine-generated, byte-exact dumper output and none of the data files can
# carry an inline header.
[[annotations]]
path = ["conformance/fixtures/**", "conformance/corpus.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2006 Princeton University"
SPDX-License-Identifier = "LicenseRef-WordNet"

# The etymology conformance kit: a hand-authored test overlay (not from any Wiktionary dump) and the
# dumps it produces, which aggregate WordNet glosses with that ursa.nz-authored etymology prose.
# Machine-generated or data files with no place for an inline header.
[[annotations]]
path = ["conformance/etym/etym.onym", "conformance/etym/corpus.txt", "conformance/etym/fixtures/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2006 Princeton University", "2026 ursa.nz <code@ursa.nz>"]
SPDX-License-Identifier = "LicenseRef-WordNet AND GPL-3.0-or-later"

# The translations conformance kit: a trimmed slice of the real Open Multilingual Wordnet overlay
# (MultiWordNet, Wordnet Bahasa, OpenWN-PT) and the dumps it produces, which aggregate WordNet
# glosses with those translations. Each component keeps its own licence; the corpus is the
# ursa.nz-authored word list. Machine-generated or data files with no place for an inline header.
[[annotations]]
path = ["conformance/omw/omw.onym", "conformance/omw/corpus.txt", "conformance/omw/fixtures/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = [
  "2006 Princeton University",
  "2010-2020 MultiWordNet, FBK",
  "2011-2015 Wordnet Bahasa, Francis Bond and others",
  "2010-2020 OpenWN-PT, Alexandre Rademaker and others",
  "2026 ursa.nz <code@ursa.nz>",
]
SPDX-License-Identifier = "LicenseRef-WordNet AND CC-BY-3.0 AND MIT AND CC-BY-SA-3.0 AND GPL-3.0-or-later"

# Config files that cannot carry, or do not warrant, an inline header, and the machine-managed
# lockfiles, including the producer tools' own lockfiles.
[[annotations]]
path = [".gitignore", ".editorconfig", ".gitmodules", "Cargo.lock", "tools/etym-build/Cargo.lock", "tools/omw-build/Cargo.lock"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ursa.nz <code@ursa.nz>"
SPDX-License-Identifier = "GPL-3.0-or-later"
