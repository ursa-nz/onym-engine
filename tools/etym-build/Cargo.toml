# A build-time tool, deliberately outside the engine workspace so its dependencies never reach the
# zero-dependency core. The empty [workspace] table makes this its own workspace root, so cargo
# does not try to fold it into the engine workspace beside it.
[workspace]

[package]
name = "etym-build"
version = "0.0.1"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-or-later"
description = "Builds the Onym etymology overlay (etym.onym) from wiktextract, keyed to WordNet."

[[bin]]
name = "etym-build"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
