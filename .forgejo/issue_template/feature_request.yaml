name: Feature request
about: Suggest a change to the engine, its bindings, or the conformance kit
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. The engine drives Onym and Onymdroid alike, so changes to its
        behaviour are weighed against the spec in `spec/engine.md`. Please describe the problem first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What does the engine make hard or fail to express today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you like the engine, a binding, or the conformance kit to do instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why they fall short.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
