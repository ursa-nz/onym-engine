version = 1

# The conformance fixtures and corpus are derived from the WordNet 3.0 lexical database from
# Princeton University, redistributed under the permissive WordNet licence. Declared here because
# the fixtures are machine-generated, byte-exact dumper output and none of the data files can
# carry an inline header.
[[annotations]]
path = ["conformance/fixtures/**", "conformance/corpus.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2006 Princeton University"
SPDX-License-Identifier = "LicenseRef-WordNet"

# Config files that cannot carry, or do not warrant, an inline header, and the machine-managed
# lockfile.
[[annotations]]
path = [".gitignore", ".editorconfig", "Cargo.lock"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ursa.nz <code@ursa.nz>"
SPDX-License-Identifier = "GPL-3.0-or-later"
