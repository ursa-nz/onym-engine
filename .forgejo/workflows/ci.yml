name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Build inside an Ubuntu 24.04 container so the environment is the same on Forgejo and
    # GitHub, regardless of the runner image.
    container: ubuntu:24.04
    steps:
      # The base image is minimal and runs as root. Install Node and git, which the checkout
      # action needs, before that step. There is no sudo because we are already root.
      # zstd is what the onym-data submodule's prepare.sh uses to materialise the WordNet base the
      # conformance, etymology and translation tests open. Without the submodule those tests skip
      # themselves, so it is initialised below and they actually run.
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git nodejs curl gcc libc6-dev pipx zstd

      - uses: actions/checkout@v4

      # Ubuntu's packaged Rust is too old for edition 2024, so install rustup without a default
      # toolchain and then the 1.96.0 pin from rust-toolchain.toml explicitly, whose default
      # profile includes rustfmt and clippy. Explicit, because the shim's on-demand install is
      # not atomic and a flaky download once left a broken toolchain for the Format step.
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install

      - name: REUSE lint
        # reuse is fetched from PyPI at run time and the current release refuses
        # to start without an encoding-detection module. Pull the
        # charset-normalizer extra so the install is self-contained.
        run: pipx run --spec 'reuse[charset-normalizer]' reuse lint

      # Initialised after the REUSE lint so the lint sees only this repository's own files; the
      # onym-data project carries its own licences and REUSE compliance.
      - name: Check out the onym-data submodule
        run: git submodule update --init

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
