# SPDX-License-Identifier: GPL-3.0-or-later
#
# The gate for the engine, mirroring the Forgejo and GitHub workflows onto Katara's
# own CI. Until this existed the engine had no gate at all: it is the Rust core both
# Onym and Onymdroid build from, so a change to it was only ever tested when one of
# those apps happened to build, and its conformance suite ran nowhere.
#
# Two jobs, kept apart because they need different runtimes: REUSE is a Python tool
# and the rest is cargo. Both run on the general `podman` runner.
#
# The image pins the same compiler as rust-toolchain.toml. If one moves the other
# has to, or rustup downloads the pinned toolchain on every run to correct it.

include:
  - project: ursa.nz/ci-templates
    ref: main
    file: /reuse.yml

stages:
  - test

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

variables:
  # The tests materialise their WordNet fixture by running onym-data/prepare.sh, and
  # skip rather than fail when the submodule is absent. Without this the suite would
  # pass by doing nothing.
  GIT_SUBMODULE_STRATEGY: recursive
  CARGO_TERM_COLOR: always

# reuse.yml carries the job. This adds the clone settings.
reuse:
  variables:
    # reuse lints whatever is on disk, and onym-data is its own repo: it carries its
    # own LICENSES and its own lint, and licence compliance does not inherit across a
    # submodule boundary. Skipping the fetch is not enough on its own, because the
    # runner reuses a build directory and git leaves a registered submodule's files
    # where they are, so a previous job's checkout stays and gets linted. Cloning
    # fresh is what actually keeps this job to this repo.
    GIT_SUBMODULE_STRATEGY: none
    GIT_STRATEGY: clone

gate:
  stage: test
  image: docker.io/library/rust:1.96
  tags: [podman]
  variables:
    # GitLab caches only paths under the project directory, so the cargo home goes
    # there rather than in ~/.cargo.
    CARGO_HOME: $CI_PROJECT_DIR/.ci/cargo
  cache:
    - key:
        prefix: cargo
        files:
          - Cargo.lock
      paths:
        - .ci/cargo/registry
        - .ci/cargo/git
        - target
  before_script:
    # tar and zstd are what onym-data/prepare.sh decompresses the vendored graph
    # with. It fetches nothing, so this is the whole of its toolchain.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends tar zstd >/dev/null
    # The official rust images install their toolchain on the minimal profile, in
    # the slim and the full variant alike, so neither ships rustfmt or clippy and
    # two of the three checks below have nothing to run. They are added here rather
    # than baked into a toolchain image because this is the only repo that needs
    # them, and they are a few megabytes against the SDK and NDK that justified one.
    - rustup component add rustfmt clippy
  script:
    - cargo fmt --check
    - cargo clippy --all-targets -- -D warnings
    - cargo test
